<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Christmas Tree 🎄</title>

  <!-- MediaPipe (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    body {
      background-color: #000;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
      user-select: none;
    }

    .input_video { display: none; }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;
      color: #00ff00;
      z-index: 100;
      text-align: center;
      line-height: 1.4;
      padding: 14px 18px;
      border-radius: 12px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0,255,0,0.25);
      max-width: min(520px, 90vw);
    }

    #instruction {
      position: absolute;
      bottom: 16px;
      width: 100%;
      text-align: center;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.85);
      z-index: 50;
      pointer-events: none;
      text-shadow: 0 0 5px #000;
      padding: 0 12px;
      line-height: 1.4;
    }

    #cam-preview {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 160px;
      height: 120px;
      z-index: 20;
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      transform: scaleX(-1);
      opacity: 0.55;
      background: rgba(255,255,255,0.05);
    }

    #badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 60;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 4px rgba(0,0,0,0.6);
    }
    #badge b { color: #fff; }

    /* 一鍵切換按鈕 */
    #toggleMode {
      position: absolute;
      top: 52px;
      right: 10px;
      z-index: 70;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.9);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(6px);
      transition: transform .12s ease, background .12s ease;
    }
    #toggleMode:hover { background: rgba(255,255,255,0.08); }
    #toggleMode:active { transform: scale(0.98); }

    /* 展示模式：乾淨畫面 */
    body.showcase #cam-preview,
    body.showcase #instruction,
    body.showcase #badge {
      display: none !important;
    }
    body.showcase #toggleMode { top: 10px; }
  </style>
</head>
<body>

  <div id="loading">
    正在啟動魔法相機...<br>
    <span style="font-size:14px; color:#bbb;">(請允許相機權限；或按住 Space 也可打開聖誕樹)</span>
  </div>

  <div id="instruction">
    ✋ 對著鏡頭「單手張開」來打開聖誕樹，點擊掉落的禮物！ 🎁
    <br>
    <span style="opacity:.75;">備援：按住 <b>Space</b> 可打開樹｜按 <b>H</b> 切換展示/教學</span>
  </div>

  <div id="badge">狀態：<b id="statusText">初始化</b></div>
  <button id="toggleMode" type="button">切換：展示模式</button>

  <video class="input_video" playsinline></video>
  <canvas id="cam-preview"></canvas>
  <canvas id="main-canvas"></canvas>

  <script>
    // =========================
    // 0) 基本元素
    // =========================
    const videoElement = document.getElementsByClassName('input_video')[0];
    const previewCanvas = document.getElementById('cam-preview');
    const previewCtx = previewCanvas.getContext('2d', { alpha: true });

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });

    const loading = document.getElementById('loading');
    const statusText = document.getElementById('statusText');

    const toggleBtn = document.getElementById('toggleMode');
    const MODE_KEY = "magic_tree_mode";

    let width = 0, height = 0;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[s]));
    }

    function setStatus(text, isError = false) {
      statusText.textContent = text;
      if (isError) {
        loading.style.display = "block";
        loading.style.color = "#ff4d4d";
        loading.innerHTML =
          `啟動失敗 / 需要協助<br>` +
          `<span style="font-size:14px; color:#ffd1d1;">${escapeHtml(text)}</span><br>` +
          `<span style="font-size:14px; color:#bbb;">提示：請用 HTTPS 或 localhost 開啟，並允許相機；或按住 Space 仍可示範。</span>`;
      }
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      previewCanvas.width = 320;
      previewCanvas.height = 240;
    }
    window.addEventListener('resize', resize);
    resize();

    // =========================
    // 0.5) 展示/教學模式切換
    // =========================
    function getSavedMode() {
      try { return localStorage.getItem(MODE_KEY); } catch { return null; }
    }
    function saveMode(mode) {
      try { localStorage.setItem(MODE_KEY, mode); } catch {}
    }
    function applyMode(mode) {
      const isShowcase = (mode === "showcase");
      document.body.classList.toggle("showcase", isShowcase);
      toggleBtn.textContent = isShowcase ? "切換：教學模式" : "切換：展示模式";
      saveMode(mode);
    }
    function toggleMode() {
      const isShowcase = document.body.classList.contains("showcase");
      applyMode(isShowcase ? "guide" : "showcase");
    }
    toggleBtn.addEventListener("click", toggleMode);
    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyH") toggleMode();
    });
    applyMode(getSavedMode() || "guide");

    // =========================
    // 1) 狀態變數
    // =========================
    let treeExpansion = 0;
    let targetExpansion = 0;
    let particles = [];
    let gifts = [];
    const particlesCount = 800;

    // 備援：Space 強制開啟
    let spaceHeld = false;
    window.addEventListener('keydown', (e) => {
      if (e.code === "Space") spaceHeld = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === "Space") spaceHeld = false;
    });

    // 禮物爆光圈特效
    const bursts = []; // {x,y,r,life}
    function spawnBurst(x, y) { bursts.push({ x, y, r: 10, life: 1 }); }

    // 獎品
    const prizes = ["iPhone 15", "現金 $1000", "一個擁抱", "再來一次", "聖誕快樂", "特斯拉", "不用加班", "免費飲料"];

    // =========================
    // 1.5) 單手張開程度計算
    // =========================
    function clamp01(v) { return Math.max(0, Math.min(1, v)); }
    function dist2(a, b) {
      const dx = (a.x - b.x);
      const dy = (a.y - b.y);
      return Math.sqrt(dx*dx + dy*dy);
    }

    // 0=握拳/收，1=完全張開
    function calcHandOpenLevel(hand) {
      if (!hand || hand.length < 21) return 0;

      const palmCenter = {
        x: (hand[0].x + hand[5].x + hand[9].x + hand[13].x + hand[17].x) / 5,
        y: (hand[0].y + hand[5].y + hand[9].y + hand[13].y + hand[17].y) / 5
      };

      const palmWidth = dist2(hand[5], hand[17]); // 掌寬當尺度
      if (!isFinite(palmWidth) || palmWidth <= 1e-6) return 0;

      const tips = [4, 8, 12, 16, 20];
      let sum = 0;
      for (const i of tips) sum += dist2(hand[i], palmCenter);
      const avgTipDist = sum / tips.length;

      const ratio = avgTipDist / palmWidth;

      // 你可調這兩個數字來改敏感度：
      const minR = 0.35; // 收起/握拳附近
      const maxR = 0.85; // 大張開附近
      return clamp01((ratio - minR) / (maxR - minR));
    }

    // =========================
    // 2) 聖誕樹粒子
    // =========================
    class Particle {
      constructor() {
        this.reset();
        this.y = Math.random() * 600 - 300;
      }
      reset() {
        this.baseY = Math.random() * 600 - 300;
        this.y = this.baseY;

        this.baseRadius = (this.y + 300) * 0.4;
        this.angle = Math.random() * Math.PI * 2;

        const r = Math.random();
        if (r > 0.95) this.color = '#ff3333';
        else if (r > 0.90) this.color = '#FFD700'; // gold
        else this.color = `hsl(${100 + Math.random() * 50}, 80%, 50%)`;

        this.speed = Math.random() * 0.02 + 0.01;
        this.size = Math.random() * 2 + 1;
      }
      update(now) {
        this.angle += this.speed;

        const expandFactor = 1 + (treeExpansion * 2.5);
        const currentRadius = this.baseRadius * expandFactor;

        const floatY = this.baseY + (Math.sin(now * 0.002 + this.baseY) * 20 * treeExpansion);

        this.x = Math.cos(this.angle) * currentRadius;
        this.y = floatY;
        this.z = Math.sin(this.angle) * currentRadius;
      }
      draw() {
        const fov = 300;
        const viewDist = 400;
        const scale = fov / (fov + this.z + viewDist);

        const x2d = this.x * scale + width / 2;
        const y2d = this.y * scale + height / 2;

        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, Math.min(1, scale));
        ctx.beginPath();
        ctx.arc(x2d, y2d, this.size * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // =========================
    // 3) 禮物
    // =========================
    class Gift {
      constructor() {
        this.x = (Math.random() - 0.5) * 100;
        this.y = -200;
        this.z = (Math.random() - 0.5) * 100;

        this.vy = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 4;
        this.vz = (Math.random() - 0.5) * 4;

        this.size = 20;
        this.opened = false;
        this.text = "";
        this.life = 1.0;
        this.scale = 0;

        this.screenX = null;
        this.screenY = null;
        this.screenR = null;
      }

      update() {
        if (this.scale < 1) this.scale += 0.1;

        if (!this.opened) {
          this.x += this.vx;
          this.y += this.vy;
          this.z += this.vz;

          this.vx *= 0.98;
          this.vz *= 0.98;

          if (this.y > 400) this.life -= 0.02;
        } else {
          this.y -= 1;
          this.life -= 0.01;
        }
      }

      draw() {
        if (this.life <= 0) return;

        const fov = 300;
        const viewDist = 400;
        const scale = fov / (fov + this.z + viewDist);

        const x2d = this.x * scale + width / 2;
        const y2d = this.y * scale + height / 2;

        ctx.globalAlpha = Math.max(0, Math.min(1, this.life));

        if (!this.opened) {
          ctx.font = `${this.size * scale * 2}px Arial`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🎁", x2d, y2d);

          this.screenX = x2d;
          this.screenY = y2d;
          this.screenR = this.size * scale * 1.5;
        } else {
          ctx.font = `bold ${this.size * scale * 1.5}px Arial`;
          ctx.fillStyle = "#fff";
          ctx.shadowColor = "#ff0";
          ctx.shadowBlur = 10;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(this.text, x2d, y2d);
          ctx.shadowBlur = 0;
        }

        ctx.globalAlpha = 1;
      }
    }

    // 初始化粒子
    for (let i = 0; i < particlesCount; i++) particles.push(new Particle());

    // =========================
    // 4) MediaPipe Hands
    // =========================
    let hands = null;
    let camera = null;
    let mediapipeReady = false;

    function onResults(results) {
      if (!mediapipeReady) {
        mediapipeReady = true;
        loading.style.display = "none";
        setStatus("相機偵測中");
      }

      // preview（教學模式才畫，展示模式省資源）
      const isShowcase = document.body.classList.contains("showcase");
      if (!isShowcase) {
        try {
          previewCtx.save();
          previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
          previewCtx.drawImage(results.image, 0, 0, previewCanvas.width, previewCanvas.height);

          const lm = results.multiHandLandmarks || [];
          if (lm.length && typeof drawConnectors === "function" && typeof HAND_CONNECTIONS !== "undefined") {
            for (const landmarks of lm) {
              drawConnectors(previewCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 1 });
            }
          }
          previewCtx.restore();
        } catch (err) {}
      }

      // 控制邏輯：單手即可（若兩手出現，就取「張開程度較大」那隻）
      const lm = results.multiHandLandmarks || [];
      if (lm.length >= 1) {
        let best = 0;
        for (const hand of lm) best = Math.max(best, calcHandOpenLevel(hand));

        targetExpansion = best;

        if (best > 0.85) setStatus("樹：開啟中 🎄");
        else if (best > 0.25) setStatus("偵測到單手");
        else setStatus("單手偏收（再張開一點）");
      } else {
        targetExpansion = 0;
        setStatus("等待單手");
      }
    }

    async function startMediaPipe() {
      if (typeof Hands === "undefined" || typeof Camera === "undefined") {
        setStatus("MediaPipe 腳本載入失敗（請檢查網路或 CDN）", true);
        return;
      }

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults(onResults);

      try {
        camera = new Camera(videoElement, {
          onFrame: async () => {
            try {
              await hands.send({ image: videoElement });
            } catch (err) {}
          },
          width: 640,
          height: 480
        });

        await camera.start();
        setStatus("相機已啟動");
      } catch (err) {
        console.error(err);
        setStatus("相機啟動失敗：請允許相機或改用 HTTPS/localhost", true);
      }
    }

    // =========================
    // 5) 主動畫
    // =========================
    function animate(now = performance.now()) {
      // 背景殘影
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.fillRect(0, 0, width, height);

      // Space 備援強制全開
      const forced = spaceHeld ? 1 : null;
      const goal = (forced !== null) ? forced : targetExpansion;

      // 平滑過渡
      treeExpansion += (goal - treeExpansion) * 0.10;

      // 畫樹
      for (const p of particles) {
        p.update(now);
        p.draw();
      }

      // 掉禮物
      if (treeExpansion > 0.8 && Math.random() < 0.03) {
        gifts.push(new Gift());
      }

      // 畫禮物
      for (let i = gifts.length - 1; i >= 0; i--) {
        const g = gifts[i];
        g.update();
        g.draw();
        if (g.life <= 0) gifts.splice(i, 1);
      }

      // 爆光圈特效
      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.r += 10;
        b.life -= 0.06;

        ctx.save();
        ctx.globalAlpha = Math.max(0, b.life);
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;
        ctx.shadowColor = "#ff0";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        if (b.life <= 0) bursts.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // =========================
    // 6) 點擊互動
    // =========================
    function handleInput(x, y) {
      for (const g of gifts) {
        if (!g.opened && g.screenX != null) {
          const dx = x - g.screenX;
          const dy = y - g.screenY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < (g.screenR || 0) + 20) {
            g.opened = true;
            g.text = prizes[Math.floor(Math.random() * prizes.length)];
            spawnBurst(g.screenX, g.screenY);
          }
        }
      }
    }

    window.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
    window.addEventListener('touchstart', (e) => {
      if (e.touches && e.touches.length) {
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    // =========================
    // 7) 啟動
    // =========================
    (async function boot() {
      const isFile = location.protocol === "file:";
      if (isFile) {
        setStatus("你正在用 file:// 開啟。相機通常會被擋，請用 localhost 或 HTTPS。", true);
        return;
      }

      setStatus("載入 MediaPipe / 啟動相機…");
      await startMediaPipe();
    })();
  </script>
</body>
</html>
